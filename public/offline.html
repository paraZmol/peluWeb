<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">
        <title>Sin conexión</title>
        <style>
            :root { color-scheme: light dark; --bg: #faf8f5; --fg: #1c1917; --muted: #57534e; --line: #d6d0c8; --primary: #8f5e45; --on-primary: #ffffff; }
            @media (prefers-color-scheme: dark) {
                :root { --bg: #0b0f14; --fg: #f5f5f4; --muted: #a8a29e; --line: #2a323c; --primary: #f2b544; --on-primary: #1c1917; }
            }
            * { box-sizing: border-box; }
            body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
            main { width: 100%; max-width: 26rem; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
            img { width: 56px; height: 56px; border-radius: 14px; }
            h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; }
            p { margin: 0; color: var(--muted); }
            .actions { display: flex; flex-wrap: wrap; gap: 8px; }
            a, button { min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 999px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
            button { border: 0; background: var(--primary); color: var(--on-primary); }
            a { border: 1px solid var(--line); color: var(--fg); }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="">
            <h1>No hay conexión</h1>
            <p>Revisa tu wifi o tus datos y vuelve a intentarlo. Tus reservas, tal como estaban la última vez que las abriste, siguen disponibles.</p>
            <div class="actions">
                <button type="button" onclick="location.reload()">Reintentar</button>
                <a href="/mis-reservas">Ver mis reservas</a>
            </div>
        </main>
    </body>
</html>
